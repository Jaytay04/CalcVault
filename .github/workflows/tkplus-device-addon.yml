name: Independent TKPlus device module

on:
  workflow_dispatch:
  push:
    branches:
      - research/tkplus-independent-source-20261002
    paths:
      - experiments/tkplus/Guest/TKPDevicePanel.m
      - experiments/tkplus/Guest/TKPProfileControls.*
      - experiments/tkplus/assemble_device_candidate.py
      - experiments/tkplus/Tests/build_device_addon.sh
      - experiments/tkplus/Tests/test_device_candidate.py
      - experiments/tkplus/Tests/TKPProfileSettingsUIFixture*
      - experiments/tkplus/Tests/test_profile_settings_ui.sh
      - .github/workflows/tkplus-device-addon.yml

permissions:
  contents: read

jobs:
  independent-device-module:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned Apple toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 16.4 Build version 16F6 "
      - name: Test synthetic profile controls and package adapter
        run: |
          bash experiments/tkplus/Tests/test_profile_controls.sh
          python3 -m unittest discover -s experiments/tkplus/Tests -p test_device_candidate.py -v
      - name: Link and verify independent iPhoneOS module
        run: bash experiments/tkplus/Tests/build_device_addon.sh "$RUNNER_TEMP/tkp-device-module"
      - name: Run synthetic profile settings UI on iOS simulator
        run: bash experiments/tkplus/Tests/test_profile_settings_ui.sh "$RUNNER_TEMP/tkp-settings-ui-fixture"
      - name: Upload only independently authored module and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: tkplus-independent-device-module-profile-entry-diagnostics5
          path: ${{ runner.temp }}/tkp-device-module/
          if-no-files-found: error
          retention-days: 7
