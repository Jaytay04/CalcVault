name: Synthetic LiveProcess device probe (manual)

on:
  workflow_dispatch:
    inputs:
      framework_guest:
        description: 'Build 20 immutable-framework route with generated synthetic guest only'
        type: boolean
        default: false
      integration_guest:
        description: 'Build the Build 22 CalcVaultKit integration with synthetic guest only'
        type: boolean
        default: false
      highlights_diagnostics:
        description: 'Enable bounded Highlights observations (requires integration_guest)'
        type: boolean
        default: false
      highlights_viewing_experiment:
        description: 'Temporary viewing-only experiment (requires integration_guest and highlights_diagnostics)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-probe:
    if: ${{ !inputs.integration_guest }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Reject Highlights options outside integration
        env:
          VIEWING: ${{ inputs.highlights_viewing_experiment }}
          DIAGNOSTICS: ${{ inputs.highlights_diagnostics }}
        run: test "$VIEWING" != true && test "$DIAGNOSTICS" != true
      - name: Test synthetic packaging rules
        run: python3 -m unittest discover -s experiments/native-social-liveprocess-device -p 'test_*.py' -v
      - name: Select pinned toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(uname -m)" = arm64
          brew install xcodegen
          test "$(xcodegen version | awk '{print $2}')" = 2.46.0
          git clone --depth 1 --branch 3.8.0 --recurse-submodules \
            https://github.com/LiveContainer/LiveContainer.git "$RUNNER_TEMP/cvlp-source"
          python3 experiments/native-social-liveprocess-device/prepare-upstream.py "$RUNNER_TEMP/cvlp-source"
          if test '${{ inputs.framework_guest }}' = true; then
            python3 experiments/native-social-liveprocess-device/prepare-framework-guest.py "$RUNNER_TEMP/cvlp-source"
          fi
          cd experiments/native-social-liveprocess-device
          xcodegen generate

      - name: Test liveness diagnostic classification
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -Wall -Wextra -Werror \
            experiments/native-social-liveprocess-device/test_liveness.c \
            -o "$RUNNER_TEMP/cvlp-liveness-tests"
          "$RUNNER_TEMP/cvlp-liveness-tests"

      - name: Test immutable framework guest contract with synthetic files
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            experiments/native-social-liveprocess-device/test_framework_guest.m \
            -o "$RUNNER_TEMP/cvlp-framework-contract-tests"
          "$RUNNER_TEMP/cvlp-framework-contract-tests"

      - name: Test signed Keychain identity selection
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            experiments/native-social-liveprocess-device/test_keychain_identity.m \
            -o "$RUNNER_TEMP/cvlp-keychain-identity-tests"
          "$RUNNER_TEMP/cvlp-keychain-identity-tests"
          echo 'Keychain identity regression tests: PASS'

      - name: Test data-preserving Keychain migration
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc CalcVault/Security/KeychainGroupMigration.swift \
            experiments/native-social-liveprocess-device/test_keychain_migration.swift \
            -o "$RUNNER_TEMP/cvlp-keychain-migration-tests"
          "$RUNNER_TEMP/cvlp-keychain-migration-tests"

      - name: Test lifecycle generation gate
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc experiments/native-social-liveprocess-device/CVLPLifecycleGate.swift \
            experiments/native-social-liveprocess-device/test_lifecycle_gate.swift \
            -o "$RUNNER_TEMP/cvlp-lifecycle-gate-tests"
          "$RUNNER_TEMP/cvlp-lifecycle-gate-tests"

      - name: Build synthetic guest and actual LiveProcess host
        shell: bash
        run: |
          set -euo pipefail
          for sdk in iphonesimulator iphoneos; do
            if test "$sdk" = iphonesimulator; then destination='generic/platform=iOS Simulator'; else destination='generic/platform=iOS'; fi
            xcodebuild build \
              -project experiments/native-social-liveprocess-device/CVLPGuest.xcodeproj \
              -scheme CVLPGuest -configuration Release -sdk "$sdk" -destination "$destination" \
              -derivedDataPath "$RUNNER_TEMP/cvlp-guest-$sdk" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              > "$RUNNER_TEMP/cvlp-guest-$sdk.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/cvlp-guest-$sdk.log"; exit 1; }
            xcodebuild build \
              -project "$RUNNER_TEMP/cvlp-source/LiveContainer.xcodeproj" \
              -scheme LiveContainer -configuration Debug -sdk "$sdk" -destination "$destination" \
              -derivedDataPath "$RUNNER_TEMP/cvlp-host-$sdk" \
              LIVECONTAINER_BUNDLE_IDENTIFIER=com.jaylintaylor.calcvault \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              > "$RUNNER_TEMP/cvlp-host-$sdk.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/cvlp-host-$sdk.log"; exit 1; }
          done

      - name: Prepatch the synthetic payloads before any device signing
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$device"
          echo "CVLP_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          sleep 90
          host="$RUNNER_TEMP/cvlp-host-iphonesimulator/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          codesign --force --deep --sign - "$host"
          xcrun simctl install "$device" "$host"
          for sdk in iphoneos iphonesimulator; do
            guest="$RUNNER_TEMP/cvlp-guest-$sdk/Build/Products/Release-$sdk/CVLPGuest.app"
            payload="$RUNNER_TEMP/cvlp-payload-$sdk.dylib"
            cp "$guest/CVLPGuest" "$payload"
            xcrun otool -hv "$payload" | grep -q EXECUTE
            SIMCTL_CHILD_CVLP_PREPATCH_PATH="$payload" \
              xcrun simctl launch --terminate-running-process "$device" com.jaylintaylor.calcvault || true
            # The prepatch helper intentionally exits. Its result file and Mach-O
            # header below are authoritative even when simctl reports that exit.
            patched=0
            for attempt in {1..20}; do
              if test -f "$payload.result"; then patched=1; break; fi
              sleep 2
            done
            test "$patched" = 1
            printf 'Prepatch result for %s: ' "$sdk"
            cat "$payload.result" "$payload.flags"
            printf '\n'
            test "$(cat "$payload.result")" = PATCHED
            xcrun otool -hv "$payload" > "$payload.header"
            cat "$payload.header"
            grep -q DYLIB "$payload.header"
          done

      - name: Package one resignable phone app and sign simulator fixture
        shell: bash
        run: |
          set -euo pipefail
          for sdk in iphoneos iphonesimulator; do
            host="$RUNNER_TEMP/cvlp-host-$sdk/Build/Products/Debug-$sdk/LiveContainer.app"
            guest="$RUNNER_TEMP/cvlp-guest-$sdk/Build/Products/Release-$sdk/CVLPGuest.app"
            package_args=("$host" "$guest" "$RUNNER_TEMP/cvlp-payload-$sdk.dylib" "$RUNNER_TEMP/cvlp-entitlements-$sdk")
            if test "$sdk" = iphonesimulator; then package_args+=(--simulator); fi
            python3 experiments/native-social-liveprocess-device/package-fixture.py "${package_args[@]}"
            if test '${{ inputs.framework_guest }}' = true; then
              python3 experiments/native-social-liveprocess-device/package-framework-fixture.py \
                "$host" "$guest" "$RUNNER_TEMP/cvlp-payload-$sdk.dylib"
              codesign --force --sign - "$host/Frameworks/NativeGuest.framework"
              codesign --verify --strict --verbose=2 "$host/Frameworks/NativeGuest.framework"
            fi
            # Mach-O prepatching invalidates any linker-generated signature.
            # Sign and verify the loose payload explicitly before sealing its host.
            payload="$host/Frameworks/SyntheticNativeGuestPayload.dylib"
            codesign --force --sign - "$payload"
            codesign --verify --strict --verbose=2 "$payload"
            codesign --force --deep --sign - "$host"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/cvlp-entitlements-$sdk/extension.entitlements" "$host/PlugIns/LiveProcess.appex"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/cvlp-entitlements-$sdk/host.entitlements" "$host"
            codesign --verify --deep "$host"
            codesign --verify --strict --verbose=2 "$payload"
            codesign -d --verbose=4 "$payload" 2> "$RUNNER_TEMP/cvlp-payload-$sdk.signature"
            codesign -d --entitlements - "$host/PlugIns/LiveProcess.appex" 2>/dev/null > "$RUNNER_TEMP/cvlp-extension-$sdk.plist"
            if grep -q calcvault.hostonly "$RUNNER_TEMP/cvlp-extension-$sdk.plist"; then exit 1; fi
            xcrun otool -hv "$host/Frameworks/SyntheticNativeGuestPayload.dylib" | grep -q DYLIB
          done
          host="$RUNNER_TEMP/cvlp-host-iphoneos/Build/Products/Debug-iphoneos/LiveContainer.app"
          xcrun vtool -show-build "$host/Frameworks/SyntheticNativeGuestPayload.dylib" | grep -Eq 'platform IOS([[:space:]]|$)'
          mkdir -p "$RUNNER_TEMP/cvlp-package/Payload"
          ditto "$host" "$RUNNER_TEMP/cvlp-package/Payload/LiveContainer.app"
          cd "$RUNNER_TEMP/cvlp-package"
          zip -qry SyntheticLiveProcess-device-probe.ipa Payload
          shasum -a 256 SyntheticLiveProcess-device-probe.ipa > SyntheticLiveProcess-device-probe.ipa.sha256

      - name: Simulator guest smoke test (no sandbox verdict)
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/cvlp-host-iphonesimulator/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          xcrun simctl install "$CVLP_SIMULATOR" "$host"
          sleep 10
          SIMCTL_CHILD_CVLP_AUTORUN=1 SIMCTL_CHILD_CVLP_LIFECYCLE_AUTOTEST=lock \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault
          found=0
          for attempt in {1..8}; do
            sleep 10
            xcrun simctl spawn "$CVLP_SIMULATOR" log show --last 5m --style compact \
              --predicate 'eventMessage CONTAINS "CVLP_"' > "$RUNNER_TEMP/cvlp-probe.log"
            if grep -q CVLP_GUEST_VISIBLE "$RUNNER_TEMP/cvlp-probe.log" && \
               grep -q CVLP_LIFECYCLE_EXIT_OBSERVED "$RUNNER_TEMP/cvlp-probe.log"; then found=1; break; fi
          done
          xcrun simctl io "$CVLP_SIMULATOR" screenshot "$RUNNER_TEMP/cvlp-probe.png"
          data="$(xcrun simctl get_app_container "$CVLP_SIMULATOR" com.jaylintaylor.calcvault data)"
          staged="$data/Documents/Applications/org.example.syntheticnativeguest.app/Frameworks/SyntheticNativeGuestPayload.dylib"
          if test '${{ inputs.framework_guest }}' = true; then
            test ! -e "$staged"
            codesign --verify --strict --verbose=2 "$host/Frameworks/NativeGuest.framework" \
              > "$RUNNER_TEMP/cvlp-staged-signature.log" 2>&1
          else
            codesign --verify --strict --verbose=2 "$staged" > "$RUNNER_TEMP/cvlp-staged-signature.log" 2>&1
            cmp "$host/Frameworks/SyntheticNativeGuestPayload.dylib" "$staged"
          fi
          cat "$RUNNER_TEMP/cvlp-probe.log"
          test "$found" = 1
          if test '${{ inputs.framework_guest }}' = true; then
            grep -q 'CVLP_FRAMEWORK selecting immutable bundle payload' "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_GEOMETRY' "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_GUEST_GEOMETRY phase=armed' "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_GUEST_GEOMETRY phase=installed' "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_FULL_WINDOW_HOST_FIT' "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_INITIAL_SCENE_GEOMETRY' "$RUNNER_TEMP/cvlp-probe.log"
            python3 experiments/native-social-liveprocess-device/verify_initial_geometry.py "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_GUEST_GEOMETRY phase=snapshot-1s' "$RUNNER_TEMP/cvlp-probe.log"
            grep -q 'CVLP_GUEST_GEOMETRY phase=runloop-2s' "$RUNNER_TEMP/cvlp-probe.log"
            grep -Eq 'CVLP_GUEST_GEOMETRY .*delegatePresent=1 delegateSceneSupport=1' "$RUNNER_TEMP/cvlp-probe.log"
            grep -Eq 'CVLP_GUEST_GEOMETRY .*rootLoaded=1' "$RUNNER_TEMP/cvlp-probe.log"
          else
            grep -q 'CVLP_LOADER selecting signed bundle payload' "$RUNNER_TEMP/cvlp-probe.log"
          fi
          grep -q 'CVLP_LOADER dlopen returned handle=1' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_UI scene-attached' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_LIFECYCLE_COVER_INSTALLED' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_LIFECYCLE_KILL_REQUESTED' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_LIFECYCLE_ALIVE_BEFORE_REVOKE' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'exit observed (ESRCH); settled' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_LIVENESS phase=launch ' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'firstPreRevoke={pid=' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'postcheck={pid=' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_PROCESS_GROUP_PRESENT_BEFORE_REVOKE' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'CVLP_PROCESS_GROUP_SHUTDOWN_OBSERVED' "$RUNNER_TEMP/cvlp-probe.log"
          grep -q 'signing-export open ABSENT' "$RUNNER_TEMP/cvlp-probe.log"
          for stage in pre-bookmark post-bookmark post-loader guest-entry; do
            grep -q "CVLP_STAGE Stage $stage .*host/extension processes distinct" "$RUNNER_TEMP/cvlp-probe.log"
          done
          {
            echo '## Synthetic LiveProcess probe'
            echo '- One containing app, one LiveProcess extension, embedded synthetic guest.'
            echo '- Immutable framework variant: ${{ inputs.framework_guest }} (no real social package in CI).'
            echo '- Actual LiveProcess bootstrap and guest loader: simulator smoke check passed.'
            echo '- Simulator filesystem sandbox verdict: NOT APPLICABLE (sandbox is not enforced).'
            echo '- Device SideStore signing, guest loading, file/Keychain isolation: NOT RUN.'
            echo '- Installable candidate is an ad-hoc fixture requiring SideStore re-signing; no private signing material was used.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simulator pending launch revocation (no sandbox verdict)
        shell: bash
        run: |
          set -euo pipefail
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          SIMCTL_CHILD_CVLP_AUTORUN=1 SIMCTL_CHILD_CVLP_LIFECYCLE_AUTOTEST=race \
            SIMCTL_CHILD_CVLP_DELAY_EXTENSION_COMPLETION=1 \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault
          sleep 20
          xcrun simctl spawn "$CVLP_SIMULATOR" log show --start "$start" --style compact \
            --predicate 'eventMessage CONTAINS "CVLP_"' > "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          cat "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          grep -q CVLP_LIFECYCLE_KILL_REQUESTED "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          grep -q CVLP_LIFECYCLE_LATE_COMPLETION_REJECTED "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          grep -q 'firstPreRevoke={pid=' "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          grep -q 'latestPreRevoke={pid=' "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          grep -q 'CVLP_PROCESS_GROUP_SHUTDOWN_OBSERVED' "$RUNNER_TEMP/cvlp-lifecycle-race.log"
          if grep -q CVLP_GUEST_VISIBLE "$RUNNER_TEMP/cvlp-lifecycle-race.log"; then
            echo 'Revoked pending launch incorrectly displayed a guest'; exit 1
          fi
          xcrun simctl io "$CVLP_SIMULATOR" screenshot "$RUNNER_TEMP/cvlp-lifecycle-race.png"
          echo '- Simulator pending-launch callback rejected without guest visibility; physical revocation and audio remain NOT RUN.' >> "$GITHUB_STEP_SUMMARY"

      - name: Invalid initial geometry revokes before launch acceptance
        if: ${{ inputs.framework_guest }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          SIMCTL_CHILD_CVLP_AUTORUN=1 SIMCTL_CHILD_CVLP_TEST_INVALID_INITIAL_GEOMETRY=1 \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault
          sleep 20
          xcrun simctl spawn "$CVLP_SIMULATOR" log show --start "$start" --style compact \
            --predicate 'eventMessage CONTAINS "CVLP_"' > "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"
          cat "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"
          grep -q CVLP_INITIAL_GEOMETRY_REJECTED "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"
          grep -q CVLP_LIFECYCLE_COVER_INSTALLED "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"
          grep -q CVLP_LIFECYCLE_KILL_REQUESTED "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"
          grep -q CVLP_PROCESS_GROUP_SHUTDOWN_OBSERVED "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"
          if grep -Eq 'CVLP_HOST_LAUNCHED|CVLP_GUEST_VISIBLE|CVLP_INITIAL_SCENE_GEOMETRY' "$RUNNER_TEMP/cvlp-initial-geometry-rejection.log"; then
            echo 'Invalid initial geometry incorrectly accepted or displayed a guest'; exit 1
          fi
          echo '- Simulator invalid-initial-geometry rejection covered and revoked before host launch acceptance.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guest diagnostic deadline and scheduler checks
        if: ${{ inputs.framework_guest }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          SIMCTL_CHILD_CVLP_AUTORUN=1 SIMCTL_CHILD_CVLP_LIFECYCLE_AUTOTEST=diagnostic-deadline \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault
          found=0
          for attempt in {1..8}; do
            sleep 10
            xcrun simctl spawn "$CVLP_SIMULATOR" log show --start "$start" --style compact \
              --predicate 'eventMessage CONTAINS "CVLP_"' > "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
            if grep -q 'exit observed (ESRCH); settled' "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"; then found=1; break; fi
          done
          cat "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          test "$found" = 1
          grep -q CVLP_GUEST_VISIBLE "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          grep -q CVLP_LIFECYCLE_KILL_REQUESTED "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          grep -q CVLP_SYNTHETIC_INACTIVE_NOTIFICATION "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          grep -q CVLP_FULL_WINDOW_HOST_FIT "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          grep -q CVLP_INITIAL_SCENE_GEOMETRY "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          python3 experiments/native-social-liveprocess-device/verify_initial_geometry.py "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          python3 experiments/native-social-liveprocess-device/verify_guest_diagnostics.py "$RUNNER_TEMP/cvlp-diagnostic-deadline.log"
          echo '- Both guest diagnostic schedulers, bounded monotonic observations, deadline terminal marker and later host lock/exit passed in the simulator.' >> "$GITHUB_STEP_SUMMARY"

      - name: Portrait-only framework host rejects landscape
        if: ${{ inputs.framework_guest }}
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/cvlp-host-iphonesimulator/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          python3 - "$host/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as stream:
              info = plistlib.load(stream)
          for key in ('UISupportedInterfaceOrientations', 'UISupportedInterfaceOrientations~iphone', 'UISupportedInterfaceOrientations~ipad'):
              assert info[key] == ['UIInterfaceOrientationPortrait'], key
          PY
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          SIMCTL_CHILD_CVLP_AUTORUN=1 SIMCTL_CHILD_CVLP_LIFECYCLE_AUTOTEST=portrait \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault
          sleep 25
          xcrun simctl spawn "$CVLP_SIMULATOR" log show --start "$start" --style compact \
            --predicate 'eventMessage CONTAINS "CVLP_"' > "$RUNNER_TEMP/cvlp-portrait.log"
          cat "$RUNNER_TEMP/cvlp-portrait.log"
          for marker in CVLP_GUEST_VISIBLE CVLP_PORTRAIT_LANDSCAPE_REQUEST CVLP_PORTRAIT_LANDSCAPE_REJECTED CVLP_PORTRAIT_HOST_RETAINED CVLP_LIFECYCLE_KILL_REQUESTED CVLP_PROCESS_GROUP_SHUTDOWN_OBSERVED; do
            grep -q "$marker" "$RUNNER_TEMP/cvlp-portrait.log"
          done
          if grep -q CVLP_PORTRAIT_HOST_FAILED "$RUNNER_TEMP/cvlp-portrait.log"; then exit 1; fi
          echo '- Framework host portrait-only policy rejected a landscape request, retained full-window portrait geometry and passed subsequent lock/exit checks in Simulator.' >> "$GITHUB_STEP_SUMMARY"

      - name: Legacy app delegate baseline (framework simulator route only)
        if: ${{ inputs.framework_guest }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project experiments/native-social-liveprocess-device/CVLPGuest.xcodeproj \
            -scheme CVLPGuest -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/cvlp-legacy-guest" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) CVLP_LEGACY_FIXTURE=1' \
            > "$RUNNER_TEMP/cvlp-legacy-guest.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/cvlp-legacy-guest.log"; exit 1; }
          guest="$RUNNER_TEMP/cvlp-legacy-guest/Build/Products/Release-iphonesimulator/CVLPGuest.app"
          payload="$RUNNER_TEMP/cvlp-legacy-payload.dylib"
          cp "$guest/CVLPGuest" "$payload"
          xcrun otool -hv "$payload" | grep -q EXECUTE
          xcrun vtool -show-build "$payload" > "$payload.build"
          grep -Eq 'platform IOSSIMULATOR([[:space:]]|$)' "$payload.build"
          SIMCTL_CHILD_CVLP_PREPATCH_PATH="$payload" \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault || true
          patched=0
          for attempt in {1..20}; do
            if test -f "$payload.result"; then patched=1; break; fi
            sleep 2
          done
          test "$patched" = 1
          test "$(cat "$payload.result")" = PATCHED
          xcrun otool -hv "$payload" > "$payload.header"
          grep -q DYLIB "$payload.header"
          xcrun vtool -show-build "$payload" > "$payload.build"
          grep -Eq 'platform IOSSIMULATOR([[:space:]]|$)' "$payload.build"

          source_host="$RUNNER_TEMP/cvlp-host-iphonesimulator/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          legacy_host="$RUNNER_TEMP/cvlp-legacy-host/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          mkdir -p "$(dirname "$legacy_host")"
          ditto "$source_host" "$legacy_host"
          python3 experiments/native-social-liveprocess-device/stage_legacy_simulator.py \
            "$legacy_host" "$guest" "$payload"
          framework="$legacy_host/Frameworks/NativeGuest.framework"
          codesign --force --sign - "$framework"
          codesign --verify --strict --verbose=2 "$framework"
          codesign --force --deep --sign - "$legacy_host"
          codesign --force --sign - \
            --entitlements "$RUNNER_TEMP/cvlp-entitlements-iphonesimulator/extension.entitlements" \
            "$legacy_host/PlugIns/LiveProcess.appex"
          codesign --force --sign - \
            --entitlements "$RUNNER_TEMP/cvlp-entitlements-iphonesimulator/host.entitlements" \
            "$legacy_host"
          codesign --verify --deep "$legacy_host"
          codesign --verify --strict --verbose=2 "$framework"
          codesign -d --entitlements - "$legacy_host/PlugIns/LiveProcess.appex" 2>/dev/null \
            > "$RUNNER_TEMP/cvlp-legacy-extension-entitlements.plist"
          if grep -q calcvault.hostonly "$RUNNER_TEMP/cvlp-legacy-extension-entitlements.plist"; then exit 1; fi
          xcrun simctl install "$CVLP_SIMULATOR" "$legacy_host"

          legacy_start="$(date '+%Y-%m-%d %H:%M:%S')"
          SIMCTL_CHILD_CVLP_AUTORUN=1 SIMCTL_CHILD_CVLP_LIFECYCLE_AUTOTEST=lock \
            xcrun simctl launch --terminate-running-process "$CVLP_SIMULATOR" com.jaylintaylor.calcvault
          found=0
          for attempt in {1..8}; do
            sleep 10
            xcrun simctl spawn "$CVLP_SIMULATOR" log show --start "$legacy_start" --style compact \
              --predicate 'eventMessage CONTAINS "CVLP_"' > "$RUNNER_TEMP/cvlp-legacy.log"
            if grep -q CVLP_LEGACY_MAIN "$RUNNER_TEMP/cvlp-legacy.log" && \
               grep -q 'CVLP_GUEST_GEOMETRY phase=armed' "$RUNNER_TEMP/cvlp-legacy.log" && \
               grep -q CVLP_LIFECYCLE_KILL_REQUESTED "$RUNNER_TEMP/cvlp-legacy.log" && \
               grep -q 'exit observed (ESRCH); settled' "$RUNNER_TEMP/cvlp-legacy.log"; then found=1; break; fi
          done
          xcrun simctl io "$CVLP_SIMULATOR" screenshot "$RUNNER_TEMP/cvlp-legacy.png"
          cat "$RUNNER_TEMP/cvlp-legacy.log"
          test "$found" = 1
          grep -q 'CVLP_FRAMEWORK selecting immutable bundle payload' "$RUNNER_TEMP/cvlp-legacy.log"
          grep -q 'CVLP_LOADER dlopen returned handle=1' "$RUNNER_TEMP/cvlp-legacy.log"
          grep -q CVLP_LEGACY_MAIN "$RUNNER_TEMP/cvlp-legacy.log"
          grep -q 'CVLP_GUEST_GEOMETRY phase=armed' "$RUNNER_TEMP/cvlp-legacy.log"
          grep -q CVLP_LIFECYCLE_KILL_REQUESTED "$RUNNER_TEMP/cvlp-legacy.log"
          grep -q 'exit observed (ESRCH); settled' "$RUNNER_TEMP/cvlp-legacy.log"

          window_created='not observed'
          legacy_visible='not observed'
          scene_support_zero='not observed'
          if grep -q CVLP_LEGACY_WINDOW_CREATED "$RUNNER_TEMP/cvlp-legacy.log"; then window_created='observed'; fi
          if grep -q CVLP_LEGACY_VISIBLE "$RUNNER_TEMP/cvlp-legacy.log"; then legacy_visible='observed'; fi
          if grep -Eq 'delegateSceneSupport=0' "$RUNNER_TEMP/cvlp-legacy.log"; then scene_support_zero='observed'; fi
          {
            echo '### Legacy app delegate simulator baseline'
            echo '- Synthetic framework guest was rebuilt with CVLP_LEGACY_FIXTURE=1 and staged into a dedicated simulator host clone.'
            echo '- CVLP_LEGACY_MAIN, armed guest geometry diagnostics, and lifecycle revocation/exit were observed.'
            echo "- CVLP_LEGACY_WINDOW_CREATED: $window_created; CVLP_LEGACY_VISIBLE: $legacy_visible; delegateSceneSupport=0: $scene_support_zero."
            echo '- Missing window creation or visibility is recorded as the legacy startup outcome, not treated as a product-smoke failure.'
            echo '- This experiment used one simulator app identity; device-target host and IPA were not modified by the legacy stage.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect synthetic simulator diagnostics on failure
        if: failure() && env.CVLP_SIMULATOR != ''
        shell: bash
        run: |
          xcrun simctl spawn "$CVLP_SIMULATOR" log show --last 10m --style compact \
            --predicate 'process == "LiveContainer" OR process == "LiveProcess" OR process == "runningboardd" OR process == "SpringBoard" OR process == "amfid" OR eventMessage CONTAINS "CVLP_"' \
            > "$RUNNER_TEMP/cvlp-failure.log" || true
          xcrun simctl io "$CVLP_SIMULATOR" screenshot "$RUNNER_TEMP/cvlp-failure.png" || true
          mkdir -p "$RUNNER_TEMP/cvlp-crashes"
          for report in "$HOME"/Library/Logs/DiagnosticReports/LiveProcess*.ips "$HOME"/Library/Logs/DiagnosticReports/LiveContainer*.ips "$HOME"/Library/Logs/DiagnosticReports/CVLPGuest*.ips; do
            if test -f "$report"; then cp "$report" "$RUNNER_TEMP/cvlp-crashes/"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-liveprocess-device-probe${{ inputs.framework_guest && '-framework' || '' }}
          path: |
            ${{ runner.temp }}/cvlp-package/SyntheticLiveProcess-device-probe.ipa
            ${{ runner.temp }}/cvlp-package/SyntheticLiveProcess-device-probe.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-liveprocess-device-probe-evidence${{ inputs.framework_guest && '-framework' || '' }}
          path: |
            ${{ runner.temp }}/cvlp-probe.log
            ${{ runner.temp }}/cvlp-probe.png
            ${{ runner.temp }}/cvlp-failure.log
            ${{ runner.temp }}/cvlp-failure.png
            ${{ runner.temp }}/cvlp-crashes/
            ${{ runner.temp }}/cvlp-host-*.log
            ${{ runner.temp }}/cvlp-guest-*.log
            ${{ runner.temp }}/cvlp-payload-*.result
            ${{ runner.temp }}/cvlp-payload-*.flags
            ${{ runner.temp }}/cvlp-payload-*.header
            ${{ runner.temp }}/cvlp-payload-*.signature
            ${{ runner.temp }}/cvlp-staged-signature.log
            ${{ runner.temp }}/cvlp-lifecycle-race.log
            ${{ runner.temp }}/cvlp-lifecycle-race.png
            ${{ runner.temp }}/cvlp-diagnostic-deadline.log
            ${{ runner.temp }}/cvlp-initial-geometry-rejection.log
            ${{ runner.temp }}/cvlp-portrait.log
            ${{ runner.temp }}/cvlp-legacy.log
            ${{ runner.temp }}/cvlp-legacy.png
            ${{ runner.temp }}/cvlp-legacy-guest.log
            ${{ runner.temp }}/cvlp-legacy-payload.dylib.result
            ${{ runner.temp }}/cvlp-legacy-payload.dylib.flags
            ${{ runner.temp }}/cvlp-legacy-payload.dylib.header
            ${{ runner.temp }}/cvlp-legacy-payload.dylib.build
            ${{ runner.temp }}/cvlp-legacy-extension-entitlements.plist
          if-no-files-found: ignore
          retention-days: 7

  build-integration:
    if: ${{ inputs.integration_guest }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-social-integration.yml
    with:
      highlights_diagnostics: ${{ inputs.highlights_diagnostics }}
      highlights_viewing_experiment: ${{ inputs.highlights_viewing_experiment }}
