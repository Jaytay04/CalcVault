name: Synthetic native guest host launch (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-launch:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(uname -m)" = arm64
          brew install xcodegen
          test "$(xcodegen version | awk '{print $2}')" = 2.46.0
      - name: Fetch pinned disposable host
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.8.0 --recurse-submodules \
            https://github.com/LiveContainer/LiveContainer.git "$RUNNER_TEMP/livecontainer-host"
          test "$(git -C "$RUNNER_TEMP/livecontainer-host" rev-parse HEAD)" = \
            e370a92dfc03ce109ebce00ed4a7cfc64ad1c801
          test "$(git -C "$RUNNER_TEMP/livecontainer-host" diff --submodule=short --exit-code)" = ''
          git -C "$RUNNER_TEMP/livecontainer-host" apply \
            "$GITHUB_WORKSPACE/experiments/native-social-guest/livecontainer-simulator-harness.patch"
      - name: Build synthetic guest for simulator
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/native-social-guest
          xcodegen generate
          cd "$GITHUB_WORKSPACE"
          xcodebuild build \
            -project experiments/native-social-guest/SyntheticNativeGuest.xcodeproj \
            -scheme SyntheticNativeGuest -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/synthetic-guest-derived" \
            CODE_SIGNING_ALLOWED=NO
          guest="$RUNNER_TEMP/synthetic-guest-derived/Build/Products/Debug-iphonesimulator/SyntheticNativeGuest.app"
          test -d "$guest"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$guest/Info.plist")" = org.example.syntheticnativeguest
          lipo -archs "$guest/SyntheticNativeGuest"
      - name: Build disposable host for simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$RUNNER_TEMP/livecontainer-host/LiveContainer.xcodeproj" \
            -scheme LiveContainer -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/livecontainer-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          test -d "$RUNNER_TEMP/livecontainer-derived/Build/Products/Debug-iphonesimulator/LiveContainer.app"
      - name: Launch prepared guest in simulator host
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          sleep 150
          host="$RUNNER_TEMP/livecontainer-derived/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$host/Info.plist")"
          codesign --force --deep --sign - "$host"
          codesign --force --sign - \
            --entitlements experiments/native-social-guest/simulator-host.entitlements "$host"
          codesign --verify --deep "$host"
          xcrun simctl install "$device" "$host"
          data_container="$(xcrun simctl get_app_container "$device" "$bundle_id" data)"
          guest_target="$data_container/Documents/Applications/org.example.syntheticnativeguest.app"
          mkdir -p "$data_container/Documents/Applications"
          mkdir -p "$data_container/Documents/Data/Application/synthetic-fixture-container"
          mkdir -p "$data_container/Library/Application Support"
          printf '%s' 'Synthetic host-only sentinel' > "$data_container/Library/Application Support/synthetic-host-sentinel.txt"
          ditto "$RUNNER_TEMP/synthetic-guest-derived/Build/Products/Debug-iphonesimulator/SyntheticNativeGuest.app" "$guest_target"
          plutil -create xml1 "$guest_target/LCAppInfo.plist"
          plutil -insert LCDataUUID -string synthetic-fixture-container "$guest_target/LCAppInfo.plist"
          SIMCTL_CHILD_LC_SYNTHETIC_GUEST_TEST=1 xcrun simctl launch "$device" "$bundle_id"
          swiftc experiments/native-social-guest/verify-host-screenshot.swift -o "$RUNNER_TEMP/verify-host-screenshot"
          verified=0
          for attempt in {1..3}; do
            sleep 25
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/synthetic-guest-host.png"
            if "$RUNNER_TEMP/verify-host-screenshot" "$RUNNER_TEMP/synthetic-guest-host.png"; then
              verified=1
              break
            fi
          done
          if test "$verified" != 1; then
            xcrun simctl spawn "$device" log show --last 6m --style compact \
              --predicate 'process == "LiveContainer" OR process == "SyntheticNativeGuest" OR eventMessage CONTAINS "LiveContainerShared"' \
              | tail -n 100 || true
            crash_dir="$HOME/Library/Logs/DiagnosticReports"
            if test -d "$crash_dir"; then
              find "$crash_dir" -maxdepth 1 -type f -name 'LiveContainer*' \
                -print -exec sed -n '1,100p' {} \;
            fi
            exit 1
          fi
          echo 'synthetic_guest_host_launch=PASS; simulator_only=true; production_app_unchanged=true' >> "$GITHUB_STEP_SUMMARY"
          echo "SYNTHETIC_SIMULATOR_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Exercise native controls and synthetic host-file boundary
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project experiments/native-social-guest/SyntheticNativeGuest.xcodeproj \
            -scheme SyntheticNativeGuest -configuration Debug \
            -destination "platform=iOS Simulator,id=$SYNTHETIC_SIMULATOR_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/synthetic-guest-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Preserve synthetic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-guest-host-screenshot
          path: ${{ runner.temp }}/synthetic-guest-host.png
          if-no-files-found: ignore
