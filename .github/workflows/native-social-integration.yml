name: CalcVault native integration 23 (synthetic host for private candidate, manual)

on:
  workflow_dispatch:
    inputs:
      tiktok47_host:
        description: 'Build the Build 24 CalcVault host with the synthetic guest profile only'
        type: boolean
        default: false
      guest_pause_diagnostic:
        description: 'Default-off native pause request diagnostic; Build 24 synthetic CI only'
        type: boolean
        default: false
      highlights_diagnostics:
        description: 'Enable bounded, content-free Highlights observations (synthetic CI only)'
        type: boolean
        default: false
      highlights_viewing_experiment:
        description: 'Temporary viewing-only gate experiment; requires highlights_diagnostics'
        type: boolean
        default: false
      highlights_direct_viewing_experiment:
        description: 'Temporary native consumption-pointer experiment; requires diagnostics, excludes method experiment'
        type: boolean
        default: false
      highlights_early_viewing_experiment:
        description: 'Temporary pre-initializer native viewing experiment; requires diagnostics, excludes other experiments'
        type: boolean
        default: false
      highlights_admission_metadata:
        description: 'Read-only restored-selector metadata discovery; requires diagnostics and excludes owner and viewing experiments'
        type: boolean
        default: false
      highlights_admission_owner_metadata:
        description: 'Read-only owner metadata discovery; requires diagnostics and excludes all other experiments'
        type: boolean
        default: false
  workflow_call:
    inputs:
      guest_pause_diagnostic:
        type: boolean
        default: false
      tiktok47_host:
        description: 'Build the Build 24 CalcVault host with the synthetic guest profile only'
        type: boolean
        default: false
      highlights_diagnostics:
        type: boolean
        default: false
      highlights_viewing_experiment:
        type: boolean
        default: false
      highlights_direct_viewing_experiment:
        type: boolean
        default: false
      highlights_early_viewing_experiment:
        type: boolean
        default: false
      highlights_admission_metadata:
        type: boolean
        default: false
      highlights_admission_owner_metadata:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-integration:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Validate explicit experiment scope
        env:
          TIKTOK47_HOST: ${{ inputs.tiktok47_host }}
          PAUSE: ${{ inputs.guest_pause_diagnostic }}
          VIEWING: ${{ inputs.highlights_viewing_experiment }}
          DIRECT: ${{ inputs.highlights_direct_viewing_experiment }}
          EARLY: ${{ inputs.highlights_early_viewing_experiment }}
          ADMISSION: ${{ inputs.highlights_admission_metadata }}
          OWNER: ${{ inputs.highlights_admission_owner_metadata }}
          DIAGNOSTICS: ${{ inputs.highlights_diagnostics }}
        run: |
          test "$PAUSE" != true || test "$TIKTOK47_HOST" = true
          test "$VIEWING" != true || test "$DIAGNOSTICS" = true
          test "$DIRECT" != true || test "$DIAGNOSTICS" = true
          test "$DIRECT" != true || test "$VIEWING" != true
          test "$EARLY" != true || test "$DIAGNOSTICS" = true
          test "$EARLY" != true || test "$VIEWING" != true
          test "$EARLY" != true || test "$DIRECT" != true
          test "$ADMISSION" != true || test "$DIAGNOSTICS" = true
          test "$ADMISSION" != true || test "$VIEWING" != true
          test "$ADMISSION" != true || test "$DIRECT" != true
          test "$ADMISSION" != true || test "$EARLY" != true
          test "$OWNER" != true || test "$DIAGNOSTICS" = true
          test "$OWNER" != true || test "$ADMISSION" != true
          test "$OWNER" != true || test "$VIEWING" != true
          test "$OWNER" != true || test "$DIRECT" != true
          test "$OWNER" != true || test "$EARLY" != true
          if [[ "$TIKTOK47_HOST" == true ]]; then
            test "$DIAGNOSTICS" = false
            test "$VIEWING" = false
            test "$DIRECT" = false
            test "$EARLY" = false
            test "$ADMISSION" = false
            test "$OWNER" = false
          fi

      - name: Select pinned toolchain and prepare synthetic upstream
        env:
          TIKTOK47_HOST: ${{ inputs.tiktok47_host }}
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | tee "$RUNNER_TEMP/integration-xcode-version.log"
          test "$(uname -m)" = arm64
          brew install xcodegen
          test "$(xcodegen version | awk '{print $2}')" = 2.46.0
          source="$RUNNER_TEMP/cvlp-integration-upstream"
          bash experiments/native-social-liveprocess-device/fetch-pinned-upstream.sh "$source"
          test "$(git -C "$source" rev-parse HEAD)" = e370a92dfc03ce109ebce00ed4a7cfc64ad1c801
          python3 experiments/native-social-liveprocess-device/prepare-upstream.py "$source"
          python3 experiments/native-social-liveprocess-device/prepare-framework-guest.py "$source"
          if [[ "$TIKTOK47_HOST" == true ]]; then
            python3 experiments/native-social-integration/prepare-tiktok47-integration.py "$source"
          else
            python3 experiments/native-social-integration/prepare-integration.py "$source"
          fi
          echo "CV_INTEGRATION_UPSTREAM=$source" >> "$GITHUB_ENV"

      - name: Prepare opt-in Highlights diagnostic adapter
        if: inputs.highlights_diagnostics
        env:
          VIEWING: ${{ inputs.highlights_viewing_experiment }}
          DIRECT: ${{ inputs.highlights_direct_viewing_experiment }}
          EARLY: ${{ inputs.highlights_early_viewing_experiment }}
          ADMISSION: ${{ inputs.highlights_admission_metadata }}
          OWNER: ${{ inputs.highlights_admission_owner_metadata }}
        run: |
          args=()
          if [[ "$VIEWING" == true ]]; then args+=(--viewing-experiment); fi
          if [[ "$DIRECT" == true ]]; then args+=(--direct-viewing-experiment); fi
          if [[ "$EARLY" == true ]]; then args+=(--early-viewing-experiment); fi
          if [[ "$ADMISSION" == true ]]; then args+=(--admission-metadata); fi
          if [[ "$OWNER" == true ]]; then args+=(--admission-owner-metadata); fi
          python3 experiments/native-social-integration/prepare-highlights.py "$CV_INTEGRATION_UPSTREAM" "${args[@]}"

      - name: Test synthetic integration adapter
        run: |
          xcrun swiftc -swift-version 6 CalcVault/App/NativeGuestIntegrationProfile.swift \
            experiments/native-social-integration/test_native_profile.swift \
            -o "$RUNNER_TEMP/native-guest-profile-tests"
          "$RUNNER_TEMP/native-guest-profile-tests"
          python3 -m unittest discover -s experiments/native-social-integration -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/native-social-liveprocess-device -p 'test_*.py' -v

      - name: Build, stage, sign, and verify the selected synthetic integration host
        shell: bash
        env:
          CV_INTEGRATION_BUILD: ${{ inputs.tiktok47_host && '24' || '23' }}
          CV_NATIVE_SIGNAL_DIAGNOSTIC: ${{ inputs.guest_pause_diagnostic && '1' || '0' }}
          CV_HIGHLIGHTS_DIAGNOSTICS: ${{ inputs.highlights_diagnostics && '1' || '0' }}
        run: bash experiments/native-social-integration/build.sh "$CV_INTEGRATION_UPSTREAM" "$RUNNER_TEMP/cv-integration"

      - name: Upload ad-hoc re-signable device IPA and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calcvault-integration-host-${{ inputs.tiktok47_host && '24-synthetic' || '23' }}${{ inputs.guest_pause_diagnostic && '-pause1' || '' }}${{ inputs.highlights_admission_owner_metadata && '-highlights-owner1' || inputs.highlights_admission_metadata && '-highlights-admission2' || inputs.highlights_early_viewing_experiment && '-highlights-earlyviewing1' || inputs.highlights_direct_viewing_experiment && '-highlights-directviewing1' || inputs.highlights_viewing_experiment && '-highlights-viewing1' || inputs.highlights_diagnostics && '-highlights2' || '' }}
          path: |
            ${{ runner.temp }}/cv-integration/output/CalcVault-integration-host-${{ inputs.tiktok47_host && '24' || '23' }}${{ inputs.guest_pause_diagnostic && '-pause1' || '' }}.ipa
            ${{ runner.temp }}/cv-integration/output/CalcVault-integration-host-${{ inputs.tiktok47_host && '24' || '23' }}${{ inputs.guest_pause_diagnostic && '-pause1' || '' }}.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded synthetic build and simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calcvault-integration-host-${{ inputs.tiktok47_host && '24-synthetic' || '23' }}${{ inputs.guest_pause_diagnostic && '-pause1' || '' }}${{ inputs.highlights_admission_owner_metadata && '-highlights-owner1' || inputs.highlights_admission_metadata && '-highlights-admission2' || inputs.highlights_early_viewing_experiment && '-highlights-earlyviewing1' || inputs.highlights_direct_viewing_experiment && '-highlights-directviewing1' || inputs.highlights_viewing_experiment && '-highlights-viewing1' || inputs.highlights_diagnostics && '-highlights2' || '' }}-evidence
          path: |
            ${{ runner.temp }}/integration-xcode-version.log
            ${{ runner.temp }}/cv-integration/logs/
            ${{ runner.temp }}/cv-integration/evidence/
          if-no-files-found: ignore
          retention-days: 7
