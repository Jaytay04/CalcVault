name: Native social isolation SDK probe (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Select project Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Type-check iOS 18 extension interfaces
        shell: bash
        run: |
          set +e
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          failures=0
          for source in experiments/native-social-isolation/probe-*.swift; do
            echo "::group::$source"
            xcrun swiftc -typecheck -swift-version 6 \
              -target arm64-apple-ios18.0-simulator -sdk "$sdk" "$source"
            result=$?
            echo "probe_exit_code=$result"
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          echo "failed_probes=$failures" >> "$GITHUB_STEP_SUMMARY"
          exit "$failures"
