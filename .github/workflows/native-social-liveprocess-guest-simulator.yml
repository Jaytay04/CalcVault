name: Synthetic LiveProcess guest launch (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveprocess-guest-launch:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6

      - name: Select pinned simulator toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(uname -m)" = arm64
          brew install xcodegen
          test "$(xcodegen version | awk '{print $2}')" = 2.46.0

      - name: Fetch and patch pinned LiveContainer source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.8.0 --recurse-submodules \
            https://github.com/LiveContainer/LiveContainer.git "$RUNNER_TEMP/livecontainer-liveprocess-guest"
          source_dir="$RUNNER_TEMP/livecontainer-liveprocess-guest"
          test "$(git -C "$source_dir" rev-parse HEAD)" = \
            e370a92dfc03ce109ebce00ed4a7cfc64ad1c801
          git -C "$source_dir" apply \
            "$GITHUB_WORKSPACE/experiments/native-social-guest/liveprocess-guest-simulator.patch"
          git -C "$source_dir" diff --check

      - name: Build the synthetic guest payload
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/native-social-guest
          xcodegen generate
          cd "$GITHUB_WORKSPACE"
          xcodebuild build \
            -project experiments/native-social-guest/SyntheticNativeGuest.xcodeproj \
            -scheme SyntheticNativeGuest -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/liveprocess-guest-derived" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          guest="$RUNNER_TEMP/liveprocess-guest-derived/Build/Products/Release-iphonesimulator/SyntheticNativeGuest.app"
          test -f "$guest/SyntheticNativeGuest"
          test ! -f "$guest/SyntheticNativeGuest.debug.dylib"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$guest/Info.plist")" = \
            org.example.syntheticnativeguest
          xcrun otool -hv "$guest/SyntheticNativeGuest" | grep -q EXECUTE
          lipo -archs "$guest/SyntheticNativeGuest" | grep -q arm64

      - name: Build the disposable LiveProcess host and extension
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/livecontainer-liveprocess-guest"
          xcodebuild build \
            -project "$source_dir/LiveContainer.xcodeproj" \
            -scheme LiveContainer -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/liveprocess-host-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          host="$RUNNER_TEMP/liveprocess-host-derived/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          test -d "$host/PlugIns/LiveProcess.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$host/PlugIns/LiveProcess.appex/Info.plist")" = com.apple.ar.viewer
          echo "The disposable LiveProcess extension is embedded under PlugIns; no guest app is installed separately." >> "$GITHUB_STEP_SUMMARY"

      - name: Launch the guest through LiveProcess and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          sleep 120

          host="$RUNNER_TEMP/liveprocess-host-derived/Build/Products/Debug-iphonesimulator/LiveContainer.app"
          extension="$host/PlugIns/LiveProcess.appex"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$host/Info.plist")"
          codesign --force --deep --sign - "$host"
          codesign --force --sign - \
            --entitlements experiments/native-social-guest/simulator-host.entitlements "$extension"
          codesign --force --sign - \
            --entitlements experiments/native-social-guest/simulator-host.entitlements "$host"
          codesign --verify --deep "$host"

          xcrun simctl install "$device" "$host"
          data_container="$(xcrun simctl get_app_container "$device" "$bundle_id" data)"
          guest_source="$RUNNER_TEMP/liveprocess-guest-derived/Build/Products/Release-iphonesimulator/SyntheticNativeGuest.app"
          guest_target="$data_container/Documents/Applications/org.example.syntheticnativeguest.app"
          mkdir -p "$data_container/Documents/Applications"
          mkdir -p "$data_container/Documents/Data/Application/synthetic-liveprocess-container"
          mkdir -p "$data_container/Library/Application Support"
          printf '%s' 'Synthetic host-only sentinel' > \
            "$data_container/Library/Application Support/synthetic-host-sentinel.txt"
          ditto "$guest_source" "$guest_target"
          mkdir -p "$guest_target/Frameworks"
          cp "$guest_source/SyntheticNativeGuest" \
            "$guest_target/Frameworks/SyntheticNativeGuestPayload.dylib"
          plutil -create xml1 "$guest_target/LCAppInfo.plist"
          plutil -insert LCDataUUID -string synthetic-liveprocess-container "$guest_target/LCAppInfo.plist"
          plutil -insert LCSyntheticGuestExecutable -string \
            Frameworks/SyntheticNativeGuestPayload.dylib "$guest_target/LCAppInfo.plist"
          codesign --force --deep --sign - "$guest_target"
          xcrun otool -hv "$guest_target/SyntheticNativeGuest" | grep -q EXECUTE
          xcrun otool -hv "$guest_target/Frameworks/SyntheticNativeGuestPayload.dylib" | grep -q EXECUTE

          SIMCTL_CHILD_LC_SYNTHETIC_LIVEPROCESS_GUEST=1 \
            xcrun simctl launch "$device" "$bundle_id"
          swiftc experiments/native-social-guest/verify-host-screenshot.swift \
            -o "$RUNNER_TEMP/verify-liveprocess-guest-screenshot"

          log_file="$RUNNER_TEMP/liveprocess-guest.log"
          screenshot="$RUNNER_TEMP/synthetic-liveprocess-guest.png"
          ui_verified=0
          for attempt in {1..3}; do
            sleep 10
            xcrun simctl spawn "$device" log show --last 8m --style compact \
              --predicate 'eventMessage CONTAINS "SYNTHETIC_LIVEPROCESS"' > "$log_file" || true
            if grep -q 'SYNTHETIC_LIVEPROCESS_GUEST_EXEC' "$log_file"; then
              xcrun simctl io "$device" screenshot "$screenshot"
              if "$RUNNER_TEMP/verify-liveprocess-guest-screenshot" "$screenshot" \
                > "$RUNNER_TEMP/liveprocess-guest-ocr.log"; then
                ui_verified=1
                break
              fi
            fi
          done

          cat "$log_file"
          cat "$RUNNER_TEMP/liveprocess-guest-ocr.log" 2>/dev/null || true
          test "$ui_verified" = 1
          grep -q 'SYNTHETIC_LIVEPROCESS_GUEST_EXEC' "$log_file"
          grep -q 'SYNTHETIC_LIVEPROCESS_PIDS' "$log_file"
          pid_line="$(grep 'SYNTHETIC_LIVEPROCESS_PIDS' "$log_file" | tail -n 1)"
          host_pid="$(sed -E 's/.*host=([0-9]+) extension=([0-9]+).*/\1/' <<< "$pid_line")"
          extension_pid="$(sed -E 's/.*host=([0-9]+) extension=([0-9]+).*/\2/' <<< "$pid_line")"
          test "$host_pid" -gt 0
          test "$extension_pid" -gt 0
          test "$host_pid" -ne "$extension_pid"
          test -f "$guest_target/synthetic-liveprocess-patched.txt"
          xcrun otool -hv "$guest_target/Frameworks/SyntheticNativeGuestPayload.dylib" | grep -q DYLIB

          canary_line="$(grep 'SYNTHETIC_LIVEPROCESS_HOST_FILE_POSTBOOKMARK' "$log_file" | tail -n 1 || true)"
          if test -n "$canary_line"; then
            canary_result="$(sed -E 's/.*result=([A-Z]+).*/\1/' <<< "$canary_line")"
          else
            canary_result=NOT_REPORTED
          fi
          {
            echo '## Synthetic LiveProcess guest launch'
            echo '- Pinned upstream: LiveContainer 3.8.0 (`e370a92dfc03ce109ebce00ed4a7cfc64ad1c801`).'
            echo '- Simulator-only host install: one LiveContainer host; guest bundle staged in its data container.'
            echo "- Distinct host/extension PIDs: PASS (`$host_pid` / `$extension_pid`)."
            echo '- Synthetic guest UI: PASS (screenshot OCR).'
            echo '- Synthetic guest control and guest-data canary: NOT RUN (no accessibility-driven UI test in this bounded fixture).'
            echo "- Host-file canary observation from extension: `$canary_result` (simulator observation only; not a device isolation verdict)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve synthetic simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-liveprocess-guest-simulator-evidence
          path: |
            ${{ runner.temp }}/synthetic-liveprocess-guest.png
            ${{ runner.temp }}/liveprocess-guest.log
            ${{ runner.temp }}/liveprocess-guest-ocr.log
          if-no-files-found: ignore
