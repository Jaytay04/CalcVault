name: iOS build (manual)

on:
  workflow_dispatch:
    inputs:
      native_preflight:
        description: 'Build 21 credential preflight only; native guest execution remains disabled'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 16.4 Build version 16F6 "
      - name: Record environment
        run: sh scripts/inspect-environment.sh
      - name: Prepare explicit iOS 18.5 test simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes available -j | python3 -c 'import json,sys; sys.exit(not any(r["identifier"] == "com.apple.CoreSimulator.SimRuntime.iOS-18-5" and r.get("isAvailable") for r in json.load(sys.stdin)["runtimes"]))'; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
          fi
          CALCVAULT_TEST_UDID=$(xcrun simctl create CalcVaultCITest com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$CALCVAULT_TEST_UDID"
          xcrun simctl bootstatus "$CALCVAULT_TEST_UDID" -b
          echo "CALCVAULT_TEST_DESTINATION=platform=iOS Simulator,id=$CALCVAULT_TEST_UDID" >> "$GITHUB_ENV"
      - name: Install pinned project generator
        run: |
          brew install xcodegen
          test "$(xcodegen version | awk '{print $2}')" = "2.46.0"
      - name: Run simulator tests
        run: sh scripts/test-macos.sh
      - name: Test host credential entitlement template
        run: python3 -m unittest discover -s scripts -p test_credential_entitlements.py -v
      - name: Build unsigned device IPA
        env:
          CALCVAULT_NATIVE_PREFLIGHT: ${{ inputs.native_preflight && '1' || '0' }}
        run: sh scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: CalcVault-unsigned-iphoneos
          path: |
            build/artifacts/CalcVault-unsigned.ipa
            build/artifacts/CalcVault-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
