name: iOS build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 16.4 Build version 16F6 "
      - name: Record environment
        run: sh scripts/inspect-environment.sh
      - name: Install pinned project generator
        run: |
          brew install xcodegen
          test "$(xcodegen version | awk '{print $2}')" = "2.46.0"
      - name: Run simulator tests
        run: sh scripts/test-macos.sh
      - name: Build unsigned device IPA
        run: sh scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: CalcVault-unsigned-iphoneos
          path: |
            build/artifacts/CalcVault-unsigned.ipa
            build/artifacts/CalcVault-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
