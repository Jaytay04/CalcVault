name: SideStore CalcVault signing policy research (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-patched-sidestore:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned SideStore and apply narrow patch
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/sidestore-source"
          git clone --filter=blob:none --no-checkout https://github.com/SideStore/SideStore.git "$source_dir"
          git -C "$source_dir" checkout 6032424a0e56c1c319762e786099bdd9186a238b
          git -C "$source_dir" submodule update --init --recursive
          git -C "$source_dir" apply --check "$GITHUB_WORKSPACE/experiments/sidestore-signing-policy/omit-calcvault-certificate.patch"
          git -C "$source_dir" apply "$GITHUB_WORKSPACE/experiments/sidestore-signing-policy/omit-calcvault-certificate.patch"
          git -C "$source_dir" diff --check
          test "$(git -C "$source_dir" diff --name-only)" = "SideStore/Core/Operations/PipelineOperations/EmbedSigningCertOperation.swift"
          echo "SIDESTORE_SOURCE=$source_dir" >> "$GITHUB_ENV"

      - name: Build unsigned research IPA
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install ldid
          cd "$SIDESTORE_SOURCE"
          if ! make MARKETING_VERSION='0.7.0-20260911.328+6032424a.cv1' build > "$RUNNER_TEMP/sidestore-build.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/sidestore-build.log"
            exit 1
          fi
          make fakesign ipa > "$RUNNER_TEMP/sidestore-package.log" 2>&1 || {
            tail -n 120 "$RUNNER_TEMP/sidestore-package.log"
            exit 1
          }
          test -s SideStore.ipa
          version="$(plutil -extract CFBundleShortVersionString raw -o - SideStore.xcarchive/Products/Applications/SideStore.app/Info.plist)"
          test "$version" = '0.7.0-20260911.328+6032424a.cv1'
          unzip -Z1 SideStore.ipa | grep -q '^Payload/SideStore.app/SideStore$'
          if unzip -Z1 SideStore.ipa | grep -Ei '\.(p12|pfx|mobiledevicepairing)$'; then
            echo 'Unexpected private signing or pairing file in artifact' >&2
            exit 1
          fi
          shasum -a 256 SideStore.ipa > SideStore.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sidestore-calcvault-policy-unsigned-research
          path: |
            ${{ env.SIDESTORE_SOURCE }}/SideStore.ipa
            ${{ env.SIDESTORE_SOURCE }}/SideStore.ipa.sha256
          if-no-files-found: error
          retention-days: 7
