name: SyntheticIsolation

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SyntheticHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    dependencies:
      - target: SyntheticVaultUI
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.syntheticisolation
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Synthetic Isolation
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES

  SyntheticVaultUI:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: VaultUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.syntheticisolation.vaultui
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES

schemes:
  SyntheticHost:
    build:
      targets:
        SyntheticHost: all
    run:
      config: Debug
