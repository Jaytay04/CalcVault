name: SyntheticNativeGuest

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SyntheticNativeGuest:
    type: application
    platform: iOS
    sources:
      - path: Guest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.syntheticnativeguest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Synthetic Native Guest
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SyntheticNativeGuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SyntheticNativeGuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.syntheticnativeguest.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SyntheticNativeGuest

schemes:
  SyntheticNativeGuest:
    build:
      targets:
        SyntheticNativeGuest: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SyntheticNativeGuestUITests
